/**:
  octomap_server:
    ros__parameters:
      # ── 坐标系 ────────────────────────────────────────────────────────────
      # 世界系 = point_lio 的 odom 系。mapping_mid360.launch.py 没覆盖
      # odom_header_frame_id,用的是 point_lio 默认值 camera_init。
      frame_id: camera_init
      # base_frame_id 只在 filter_ground_plane=true 时才用到(下面关掉了)。
      base_frame_id: body

      # ── 输入点云 ──────────────────────────────────────────────────────────
      # launch 里把 cloud_in 重映射到 /cloud_registered_body。
      # 必须是机体系点云:octomap_server 取
      #   lookupTransform(frame_id, cloud.header.frame_id).translation
      # 作为射线起点。若直接喂世界系的 /cloud_registered(frame_id 已是
      # camera_init),变换是单位阵 → 射线全从世界原点射出,占据体素仍然正确
      # (所以 rviz 里看着“有地图”),但自由空间被整片刷错,墙会被从背面清空。
      # 需要的 tf:camera_init → body,由 point_lio 的激光雷达里程计广播。

      # ── 建图精度 / 性能 ───────────────────────────────────────────────────
      # 体素边长。0.1 -> 0.2 的理由是**降低 octomap 的耗时**(不是治重影 ——
      # 那颗已经由 P4 在源头修掉了):
      #   实测 0.1 m 时 octomap_server 占 78.6% CPU,每帧插入约 82 ms
      #   (/octomap_point_cloud_centers 的时戳比 /cloud_registered_body 晚 82 ms),
      #   已经接近 10 Hz 的 100 ms 预算 —— 一旦超了就会排队,延迟累积。
      #   射线穿过的体素数 ∝ 1/resolution,0.2 预计把耗时降到一半左右。
      # 代价:0.2 m 以下的薄结构(栅杆/桌腿/薄墙)会漏,贴得很近的两层会并成一坨。
      # 若要折中可试 0.15。本项同时决定 /projected_map(2D)的分辨率。
      resolution: 0.2
      sensor_model:
        # 超过该距离的点只用于给射线截断,不作为占据端点插入。
        # 20 -> 15:远处点角分辨率差、法向噪声大,是“空中碎影”的主要来源;
        # 且本项同时限制了射线长度(CPU)。
        max_range: 15.0

        # 下面四项是“残余噪声”的收尾,不是治重影的主力(那颗靠 P4)。
        # OctoMap 的更新量是对数几率:logodds(p) = ln(p/(1−p))
        #   hit 0.65 -> 命中一次 +0.619(原 0.7: +0.847)
        #     → 从 0 推到 max 需 ~4.8 次命中(原 ~4.1 次):一划而过的噪声
        #       不再那么容易就被确认为占据。
        #   max 0.95 -> 钳位在 +2.944(原 0.97: +3.477)
        #     → 配合 miss 0.4(−0.405),从满占据擦回 min 需 ~12 次 miss
        #       (原 ~13.5 次):残影退得更快一点。
        #   miss 保持 0.4:调大是**擦除变慢**,调小(如 0.35)擦得更狠但会让
        #     稀疏墙面一闪一闪。先别动。
        hit: 0.65
        miss: 0.4
        min: 0.12
        max: 0.95

        # 如果高转速下仍能看到明确两层(而不是淡影),那不是这里的问题:
        # 说明残余误差来自位姿估计,下一步去扫 point_lio 的
        # common.time_lag_imu_to_lidar(±0.02),而不是继续压 octomap 参数。

      # ── 二维投影(/projected_map,nav2 / costmap 用)─────────────────────────
      # 只把这个高度带内的体素投影成 OccupancyGrid
      # 注意:这两项**不影响 3D octomap**,治不了 3D 重影。按需要收紧。
      occupancy_min_z: -2.0
      occupancy_max_z: 3.0
      incremental_2D_projection: true

      # ── 其他 ──────────────────────────────────────────────────────────────
      filter_ground_plane: false   # 不做地面分割:地面会被当作占据体素(2D 投影里正好当地板)
      filter_speckles: true        # 去掉孤立噪点体素
      compress_map: true           # /octomap_binary 无损压缩
      publish_free_space: false    # 空闲体素 MarkerArray,带宽开销大,默认关
      latch: false                 # 实时建图,不给后加入的订阅者补发
